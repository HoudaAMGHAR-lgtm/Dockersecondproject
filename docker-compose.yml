version: '3'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"

  vscode:
    image: codercom/code-server:latest  # Utilisation de l'image VS Code Server
    restart: always
    environment:
      - PASSWORD=monpassword  # Définit un mot de passe pour sécuriser l'accès
    ports:
      - "8082:8080"  # Redirige le port du conteneur vers ton port local
    volumes:
      - ./src:/home/coder/project  # Lier le dossier 'src' de ton projet à l'éditeur

volumes:
  db_data:


